<!DOCTYPE html>
<html>
  <head>
    <title>{{properties.title}}</title>
  </head>
  <body>
    <header></header>
    <main>
      <div>
        
        <div class="hero">
          <div>
            <div>
              <h1>{{properties.elements.blogTitle.value}}</h1>
            </div>
          </div>
        </div>
        
        <div class="content">
          <div>
            <div>
              {{{properties.elements.blogDescription.value}}}
            </div>
          </div>
        </div>

        <div class="labels">
          <div>
            <div>
              <p>Labels: 
                {{#properties.elements.labels.value}}
                  <span class="label-pill">{{.}}</span>
                {{/properties.elements.labels.value}}
              </p>
            </div>
          </div>
        </div>

        <div class="author-profile">
          <div>
            <div>
              <p>
                <picture>
                  <img src="https://author-p43719-e1936337.adobeaemcloud.com{{{properties.elements.image.value}}}" alt="Author Image">
                </picture>
              </p>
            </div>
            <div>
              {{{properties.elements.authorDetails.value}}}
            </div>
          </div>
        </div>

      </div>
    </main>
    <footer></footer>
  </body>
</html>
